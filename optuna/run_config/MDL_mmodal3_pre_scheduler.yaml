run_name: 'extension1_run'
data_file: 'poi_dataset.csv'
random_state: 42
load_data:
  module: 'pandas'
  function: 'read_csv'
preproc_features:
  module: 'utilsPreproc'
  function: 'preprocess_features'
preproc_target:
  module: 'utilsPreproc'
  function: 'preprocess_target'
test_size_test: 0.2
proc:
  transform_images:
    module: 'utilsFT'
    class: 'ImagesResNet18Transform'
    parameters: {'image_path': 'main_image_path'}
  transform_embeddings:
    module: 'utilsFT'
    class: 'EmbeddingText'
    parameters: {'feature': 'shortDescription', 
                 'model_name': 'all-MiniLM-L6-v2'}
  transform_metadata:
    module: 'utilsFT'
    class: 'TransformMetadata'
    function: 'get_transformation'
    parameters: {'name': 'transform01'}
proc_to_fit:
  - 'transform_metadata'
test_size_val: 0.2
dataset:
  module: 'utilsDataset'
  class: 'multimodal3_Dataset'
search_space: 
  {
    'data_loader': {
        'batch_size': {'type': 'int', 'low': 4, 'high': 6, 'exp2': True},
    },
    'architecture': {},
    'optimizer': {
        'lr': {'type': 'float', 'low': 0.005, 'high': 0.01, 'log': True},
    },
    'criterion': {},
    'scheduler': {}
  }
fixed_params: 
  {
    'data_loader': {},
    'architecture': {
        'metadata_input': 20,
        'embeddings_input': 384,
        'dropout_rate': 0.75
    },
    'optimizer': {},
    'criterion': {},
    'scheduler': {'step_size': 2, 'gamma': 0.5}
  }
scoring:
  f1_score:
    module: 'sklearn.metrics'
    function: 'f1_score'
    parameters: {'pos_label': 1}
  sensitivity:
    module: 'sklearn.metrics'
    function: 'recall_score'
    parameters: {'pos_label': 1}
  precision:
    module: 'sklearn.metrics'
    function: 'precision_score'
    parameters: {'pos_label': 1, 'zero_division': 0}
  macro_precision:
    module: 'sklearn.metrics'
    function: 'precision_score'
    parameters: {'average': 'binary', 'zero_division': 0}
  confusion_matrix:
    module: 'utils'
    function: 'confusion_matrix_list'
device: 'gpu'
model_config:
  num_epochs: 10
  train:
    module: 'utilsModel'
    class: 'ModelScheduler'
  architecture:
    module: 'utilsNN'
    class: 'MultiModal3_pre_Class2'
  criterion: 
    module: 'torch.nn'
    function: 'CrossEntropyLoss'
  optimizer:
    module: 'torch.optim'
    function: 'Adam'
  scheduler:
    module: 'torch.optim.lr_scheduler'
    function: 'StepLR'
score: 'f1_score'
comments: 'Multimodal: ResNet18 pre + fcnn_pca + metadata using Scheduler'
num_trials: 5