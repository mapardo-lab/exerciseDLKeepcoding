run_name: 'base_name'
data_file: 'poi_dataset.csv'
random_state: 42
load_data:
  module: 'pandas'
  function: 'read_csv'
preproc_features:
  module: 'utilsPreproc'
  function: 'preprocess_features'
preproc_target:
  module: 'utilsPreproc'
  function: 'preprocess_target'
test_size_test: 0.2

proc:
  transform_features:
    module: 'utilsFT'
    class: 'EmbeddingText'
    parameters: {'feature': 'shortDescription', 
                 'model_name': 'all-MiniLM-L6-v2'}

proc_to_fit: []

test_size_val: 0.2
dataset:
  module: 'utilsDataset'
  class: 'features_Dataset'
search_space: 
  {
    'data_loader': {
        'batch_size': {'type': 'int', 'low': 2, 'high': 5, 'exp2': True},
    },
    'architecture': {
        'dropout_rate': {'type': 'float', 'low': 0.1, 'high': 1.0}
    },
    'optimizer': {
        'lr': {'type': 'float', 'low': 0.0005, 'high': 0.5, 'log': True},
    },
    'criterion': {}
  }
fixed_params: 
  {
    'data_loader': {},
    'architecture': {
        'input_size': 384, 
        'num_classes': 2, 
    },
    'optimizer': {},
    'criterion': {}
  }

scoring:
  f1_score:
    module: 'sklearn.metrics'
    function: 'f1_score'
    parameters: {'pos_label': 1}
  sensitivity:
    module: 'sklearn.metrics'
    function: 'recall_score'
    parameters: {'pos_label': 1}
  precision:
    module: 'sklearn.metrics'
    function: 'precision_score'
    parameters: {'pos_label': 1, 'zero_division': 0}
  macro_precision:
    module: 'sklearn.metrics'
    function: 'precision_score'
    parameters: {'average': 'binary', 'zero_division': 0}
  confusion_matrix:
    module: 'utils'
    function: 'confusion_matrix_list'

device: 'gpu'

model_config:
  num_epochs: 10
  train:
    module: 'utilsModel'
    class: 'ModelBase'
  architecture:
    module: 'utilsNN'
    class: 'FCNN_pca'
  criterion: 
    module: 'torch.nn'
    function: 'CrossEntropyLoss'
  optimizer:
    module: 'torch.optim'
    function: 'Adam'

score: 'f1_score'
comments: 'FCNN with Progressive Compression Architecture for embeddings'
num_trials: 20

