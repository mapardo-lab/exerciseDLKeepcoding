run_name: 'base_run'
data_file: 'poi_dataset.csv'
random_state: 42
load_data:
  module: 'pandas'
  function: 'read_csv'
preproc_features:
  module: 'utilsPreproc'
  function: 'preprocess_features'
preproc_target:
  module: 'utilsPreproc'
  function: 'preprocess_target'
test_size_test: 0.2
proc:
    module: 'utilsFT'
    class: 'TransformMetadata'
    function: 'get_transformation'
    parameters: {'name': 'transform01'}
test_size_val: 0.2
search_space: 
  {
    'model': {
        'C': {'type': 'float', 'low': 0.001, 'high': 100, 'log': True},
    }
  }
fixed_params: 
  {
    'model': {}
  }
scoring:
  f1_score:
    module: 'sklearn.metrics'
    function: 'f1_score'
    parameters: {'pos_label': 1}
  sensitivity:
    module: 'sklearn.metrics'
    function: 'recall_score'
    parameters: {'pos_label': 1}
  precision:
    module: 'sklearn.metrics'
    function: 'precision_score'
    parameters: {'pos_label': 1, 'zero_division': 0}
  macro_precision:
    module: 'sklearn.metrics'
    function: 'precision_score'
    parameters: {'average': 'binary', 'zero_division': 0}
  confusion_matrix:
    module: 'utils'
    function: 'confusion_matrix_list'
model:
  module: 'sklearn.linear_model'
  class: 'LogisticRegression'
cv: 5
score: 'f1_score'
comments: 'Logistic Regression'
num_trials: 10